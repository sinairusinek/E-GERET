<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TEI — יוזמת קידוד הטקסט</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Frank+Ruhl+Libre:wght@400;500;700;800;900&family=Heebo:wght@300;400;500;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --ink:        #1a1a1a;
    --ink-soft:   #3a3a3a;
    --paper:      #f6f1e6;
    --paper-3:    #fbf7eb;
    --rule:       #c9bfa6;
    --rule-2:     #a89c7e;
    --brick:      #8a2418;
    --teal:       #2d5a5a;
    --gold:       #a0780f;
    --muted:      #6b6354;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background: var(--paper);
    color: var(--ink);
    font-family: 'Heebo', 'Arial Hebrew', Arial, sans-serif;
    font-size: 18px;
    line-height: 1.7;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 44px 32px 48px;
  }
  .slide { max-width: 1100px; width: 100%; flex: 1; display: flex; flex-direction: column; }
  .banner {
    display: block;
    width: 100%;
    height: auto;
    border: 1.5px solid var(--rule);
    border-radius: 4px;
  }
  header { border-bottom: 2px solid var(--rule-2); padding: 30px 0 24px; }
  .kicker {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 14px;
    letter-spacing: 1.5px;
    color: var(--gold);
    direction: ltr;
    text-align: right;
    margin: 0 0 6px;
  }
  h1 {
    font-family: 'Frank Ruhl Libre', serif;
    font-weight: 800;
    font-size: clamp(38px, 5.5vw, 64px);
    line-height: 1.15;
    margin: 0;
    color: var(--brick);
    letter-spacing: -0.5px;
    text-wrap: balance;
  }
  main { flex: 1; padding: 32px 0; }
  footer {
    border-top: 1px solid var(--rule);
    padding-top: 16px;
    font-size: 15px;
    color: var(--muted);
  }
  footer a { color: var(--teal); text-decoration: none; }
  footer a:hover { text-decoration: underline; }
</style>
</head>
<body>
  <div class="slide">
    <img class="banner" src="../assets/banner.jpg" alt='בית הספר &quot;מעבר למילים&quot; — DHSS Hub, האוניברסיטה הפתוחה'>

    <header>
      <p class="kicker">Text Encoding Initiative</p>
      <h1>TEI — יוזמת קידוד הטקסט</h1>
    </header>

    <main>
      <!-- תוכן ההרחבה על TEI יתווסף כאן -->
    </main>

    <footer>
      <a href="https://tei-c.org/" target="_blank" rel="noopener">tei-c.org</a>
      &nbsp;·&nbsp;
      <a href="https://tei-c.org/release/doc/tei-p5-doc/en/html/index.html" target="_blank" rel="noopener">ההנחיות (Guidelines)</a>
    </footer>
  </div>
</body>
</html>
